services:
  deploynest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deploynest
    restart: unless-stopped
    ports:
      - "${PORT:-29870}:29870"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-29870}
      - APP_URL=${APP_URL:-http://localhost:29870}
      - DATABASE_URL=${DATABASE_URL:-file:./data/deploynest.db}
      - JWT_SECRET=${JWT_SECRET:-deploynest_production_jwt_secret_change_me_min32chars}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-deploynest_32_bytes_super_secure_encryption_key!}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-deploynest_default_webhook_secret_key}
      - DEPLOYMENT_ROOT=${DEPLOYMENT_ROOT:-/app/data/deployments}
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
